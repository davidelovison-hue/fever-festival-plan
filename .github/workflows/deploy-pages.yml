name: Deploy GitHub Pages

# Two live URLs from this one repo (GitHub Pages is one site per repo):
#   Original tabs:  https://davidelovison-hue.github.io/fever-festival-plan/
#   Stepper preview: https://davidelovison-hue.github.io/fever-festival-plan/stepper/
on:
  push:
    branches: [main, cursor/bahidora-festival-data-aab5, cursor/dual-pages-aab5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: original

      - name: Checkout stepper preview
        uses: actions/checkout@v4
        with:
          ref: cursor/plan-stepper-aab5
          path: stepper

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: original/package-lock.json

      - name: Build original site
        working-directory: original
        run: |
          npm ci
          npm run build

      - name: Build stepper preview
        working-directory: stepper
        run: |
          npm ci
          npx tsc
          npx vite build --base /fever-festival-plan/stepper/

      - name: Combine sites
        run: |
          set -euo pipefail
          cp -R stepper/dist original/dist/stepper
          touch original/dist/.nojekyll
          cp original/dist/stepper/index.html original/dist/stepper/404.html
          cat > original/dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Bahidorá 2027</title>
            <script>
              (function () {
                var stepperPrefix = '/fever-festival-plan/stepper';
                var path = location.pathname || '';
                var isStepper = path === stepperPrefix || path.indexOf(stepperPrefix + '/') === 0;
                var indexUrl = isStepper
                  ? '/fever-festival-plan/stepper/index.html'
                  : '/fever-festival-plan/index.html';
                fetch(indexUrl, { cache: 'no-store' })
                  .then(function (r) { return r.text(); })
                  .then(function (html) {
                    document.open();
                    document.write(html);
                    document.close();
                  })
                  .catch(function () {
                    location.replace(isStepper ? stepperPrefix + '/' : '/fever-festival-plan/');
                  });
              })();
            </script>
          </head>
          <body></body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: original/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
